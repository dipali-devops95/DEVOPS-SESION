
name: github workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List Project Files
        run: ls -la

      - name: Verify HTML File
        run: test -f index.html && echo "HTML file found successfully!"

      - name: Final Status
        run: echo "github workflow completed successfully!"
